<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo — Juriscorp S.C.</title>
  <meta name="robots" content="noindex, nofollow" />
  <!-- Fuentes auto-alojadas. Ver css/fonts.css. -->
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="../css/admin.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicon-180.png" />
</head>

<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="../assets/img/square-logo-120.png" alt="Juriscorp S.C." class="login-logo-img" width="120" height="120" style="margin: 0 auto 1rem; display: block; border-radius: 6px;" />
        <h1 class="login-logo">Juriscorp S.C.</h1>
        <p class="login-subtitle">Panel Administrativo</p>
      </div>

      <form id="loginForm" class="login-form">
        <div id="loginError" class="login-error"></div>

        <div class="form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" id="loginEmail" name="email" placeholder="su@correo.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" name="password" placeholder="••••••••" required
            autocomplete="current-password" />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Iniciar Sesión</span>
          <span class="spinner"></span>
        </button>
      </form>

      <p class="login-notice">
        Acceso exclusivo para personal autorizado del despacho.
      </p>
    </div>
  </div>

  <!-- SDK de Supabase con Subresource Integrity (SRI).
       El panel maneja resúmenes de casos bajo secreto profesional: un CDN
       comprometido, o un "@2" que un día resuelva a una versión con código
       malicioso, tendría acceso total a la sesión y a los datos. El navegador
       ahora rechaza el script si no coincide byte a byte con este hash.

       LA VERSIÓN ESTÁ FIJADA A PROPÓSITO. SRI y versión flotante son
       incompatibles: el hash sólo vale para unos bytes exactos.

       Se usa la ruta EXPLÍCITA (.../@2.112.3/dist/umd/supabase.js) y no la
       corta (.../@2). La corta es un fichero generado dinámicamente por
       jsDelivr, que le añade un banner y advierte en él: "Do NOT use SRI with
       dynamically generated files". La ruta explícita sirve el fichero
       original del tarball de npm y es estable.

       AL ACTUALIZAR: hay que cambiar versión Y hash A LA VEZ, y en los DOS
       archivos (admin/index.html y admin/dashboard.html). Para recalcularlo:
         curl -sL "<la URL de abajo>" -o sb.js
         openssl dgst -sha384 -binary sb.js | openssl base64 -A
       Verificado contra el CDN el 2026-08-23 (v2.112.3, 211907 bytes). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"
          integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>
  <script src="../js/admin-config.js"></script>
  <script src="../js/admin-auth.js"></script>
</body>

</html>
